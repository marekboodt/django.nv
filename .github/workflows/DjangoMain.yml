name: Django SAST Pipeline

######## IMPORTANT ########
# non-prod has 'continue-on-error: true' all other environments will be stopped if the scans give an error-code that is not "0" !!!
# Set environment as:
# environment: non-prod

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  NonProd-SCA-scan:
    uses: marekboodt/Security-Scanning-Repo/.github/workflows/sca-workflow.yml@main
    with:
      language: python
      project_dir: ./
      # non-prod has 'continue-on-error: true' all other environments will be stopped if the scans give an error.
      environment: non-prod
      
  NonProd-SAST-scan:
    uses: marekboodt/Security-Scanning-Repo/.github/workflows/sast-workflow.yml@main
    with:
      language: python
      project_dir: ./src
      # non-prod has 'continue-on-error: true' all other environments will be stopped if the scans give an error.
      environment: non-prod
#    secrets:
#      token: ${{ secrets.REUSABLEWORKFLOWACCESSDJANGOTOSECREPO }}

  Prod-SAST-scan:
    uses: marekboodt/Security-Scanning-Repo/.github/workflows/sast-workflow.yml@main
    with:
      language: python
      project_dir: ./src
      # non-prod has 'continue-on-error: true' all other environments will be stopped if the scans give an error.
      environment: prod

